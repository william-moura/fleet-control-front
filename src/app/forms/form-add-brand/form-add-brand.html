<h2 mat-dialog-title>Cadastro de Marca</h2>

<mat-dialog-content class="conteudo-modal">
  <form [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name" appUppercase />
      <mat-error *ngIf="form.get('name')?.hasError('required')">
        O campo <strong>Nome</strong> é obrigatório.
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="rodape-modal">
  <button matButton="outlined" class="button-outlined" (click)="onCancel()">Cancelar</button>
  <button matButton="filled" class="button-filled" (click)="onSubmit()">
    Salvar Marca
  </button>
</mat-dialog-actions>
