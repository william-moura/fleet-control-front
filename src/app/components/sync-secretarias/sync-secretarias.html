<table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="secretaryName">
      <th mat-header-cell *matHeaderCellDef class="center-cell"> Secretaria </th>
      <td mat-cell *matCellDef="let a" class="center-cell"> 
        {{ a.secretaryName }} 
      </td>
    </ng-container>
    <ng-container matColumnDef="orgao">
      <th mat-header-cell *matHeaderCellDef class="center-cell"> Órgão </th>
      <td mat-cell *matCellDef="let a" class="center-cell"> 
        {{ a.orgao }} 
      </td>
    </ng-container>
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef class="center-cell"> Ação </th>
      <td mat-cell *matCellDef="let a" class="center-cell"> 
        <button mat-icon-button color="primary" title="Deletar" (click)="deleteSecretary(a)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
</table>
