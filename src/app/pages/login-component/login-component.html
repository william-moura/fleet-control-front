<div class="login-page-container">
  <!-- FUNDO: Imagem de Veículos + Camada Escura + Curvas Neon -->
  <div class="backdrop-wrapper">
    <div class="vehicles-layer"></div>
    <div class="dark-overlay"></div>

    <!-- Linhas Neon curvas nos cantos -->
    <svg class="neon-line neon-line--top" viewBox="0 0 500 500" fill="none">
      <path d="M -60 300 C 60 250 180 140 210 -60" stroke="#a3e635" stroke-width="4.5" />
    </svg>
    <svg class="neon-line neon-line--bottom" viewBox="0 0 500 500" fill="none">
      <path d="M 230 560 C 260 320 380 200 560 160" stroke="#a3e635" stroke-width="4.5" />
    </svg>
  </div>

  <!-- CARD BRANCO CENTRALIZADO -->
  <main class="login-card">
    
    <!-- Cabeçalho -->
    <header class="card-header">
      <div class="brand-wrapper">
        <img src="/images/log-final.jpeg" alt="Realiza Informática" class="brand-img" />
      </div>

      <div class="fleet-badge">
        <mat-icon class="badge-icon">directions_car</mat-icon>
        <span>Sistema de Frota</span>
      </div>

      <p class="card-subtitle">Acesse o painel de gestão de frota</p>
    </header>

    @if (errorMessage()) {
      <div class="error-banner">
        {{ errorMessage() }}
      </div>
    }

    <!-- Formulário -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <!-- Campo E-mail / CPF -->
      <div class="field-item">
        <label class="field-label" for="login-input">E-mail ou CPF *</label>
        <mat-form-field appearance="outline" class="custom-field">
          <mat-icon matPrefix>person</mat-icon>
          <input 
            id="login-input"
            matInput 
            formControlName="login" 
            placeholder="Digite seu e-mail ou CPF" 
          />
          <mat-error *ngIf="loginForm.get('login')?.hasError('required')">
            Login é obrigatório
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Campo Senha -->
      <div class="field-item">
        <label class="field-label" for="password-input">Senha *</label>
        <mat-form-field appearance="outline" class="custom-field">
          <mat-icon matPrefix>lock</mat-icon>
          <input 
            id="password-input"
            matInput 
            [type]="hidePassword ? 'password' : 'text'" 
            formControlName="password" 
            placeholder="Digite sua senha" 
          />
          <button 
            mat-icon-button 
            matSuffix 
            (click)="hidePassword = !hidePassword" 
            type="button" 
            tabindex="-1"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Senha é obrigatória
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Ações -->
      <div class="row-actions">
        <mat-checkbox color="primary" class="remember-checkbox">Lembrar de mim</mat-checkbox>
        <a href="#" class="forgot-password">Esqueci a senha</a>
      </div>

      <!-- Botão Entrar -->
      <button 
        mat-flat-button 
        type="submit" 
        class="submit-btn" 
        [disabled]="loginForm.invalid || isLoading()"
      >
        @if (isLoading()) {
          <mat-spinner diameter="20" class="spinner-white"></mat-spinner>
        } @else {          
          <span>ENTRAR NO SISTEMA</span>
        }
      </button>
    </form>

    <!-- Skyline inferior dentro do card -->
    <div class="skyline-container">
      <svg viewBox="0 0 500 80" fill="none" stroke="currentColor">
        <path d="M 40 75 L 40 50 L 55 35 L 70 50 L 70 75 Z" stroke-width="1.2" />
        <path d="M 75 75 L 75 45 L 95 30 L 115 45 L 115 75 Z" stroke-width="1.2" />
        <rect x="82" y="50" width="8" height="10" stroke-width="1" />
        <rect x="98" y="50" width="8" height="10" stroke-width="1" />
        <path d="M 120 75 L 120 40 L 155 40 L 155 75 Z" stroke-width="1.2" />
        <path d="M 175 75 L 175 30 L 205 15 L 235 30 L 235 75 Z" stroke-width="1.4" />
        <path d="M 205 15 L 205 2 M 201 6 L 209 6" stroke-width="1.5" />
        <path d="M 192 40 Q 205 30 218 40 L 218 55 L 192 55 Z" stroke-width="1.2" />
        <rect x="182" y="60" width="10" height="15" stroke-width="1.2" />
        <rect x="218" y="60" width="10" height="15" stroke-width="1.2" />
        <path d="M 255 75 L 255 38 L 275 25 L 295 38 L 295 75 Z" stroke-width="1.2" />
        <path d="M 300 75 L 300 48 L 330 48 L 330 75 Z" stroke-width="1.2" />
        <line x1="20" y1="75" x2="480" y2="75" stroke-width="1.5" />
      </svg>
    </div>

    <!-- Rodapé -->
    <footer class="card-bottom">
      <div class="line-divider">
        <span class="bar"></span>
        <span class="caption">Sistema de Frota para o seu Município</span>
        <span class="bar"></span>
      </div>
    </footer>
  </main>
</div>
