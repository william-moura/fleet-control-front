<div class="container-pagina">
    <div class="header-acoes">
      <h2>Gestão de Prefeituras</h2>
      <button mat-raised-button color="primary" appNewWindow="/prefeitura/new">
        <mat-icon>add</mat-icon> Nova Prefeitura
      </button>
    </div>
    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="center-cell"> Nome </th>
          <td mat-cell *matCellDef="let row" class="center-cell"> {{row.razaoSocial}} </td>
        </ng-container>
        <ng-container matColumnDef="uf">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="center-cell"> UF </th>
          <td mat-cell *matCellDef="let row" class="center-cell"> {{row.uf}} </td>
        </ng-container>
        <ng-container matColumnDef="cnpj">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="center-cell"> CNPJ </th>
          <td mat-cell *matCellDef="let row" class="center-cell" > {{row.cnpj}} </td>
        </ng-container>
        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef class="center-cell"> Ações </th>
          <td mat-cell *matCellDef="let row" class="center-cell">
            <button mat-icon-button color="accent" title="Editar" appNewWindow="/prefeitura/edit/{{row.id}}">
                <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" title="Excluir" (click)="deletePrefeitura(row)">
                <mat-icon>delete</mat-icon>
            </button>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [length]="totalRegistros" [pageSize]="pageSize" [pageIndex]="indicePagina" (page)="onPageChange($event)">
        </mat-paginator>
    </div>
</div>
